<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#FFFDFC"/>
  <style>@font-face{font-family:'Uncage';src:url('../fonts/Uncage-Medium.woff2') format('woff2');font-weight:500}@font-face{font-family:'Uncage';src:url('../fonts/Uncage-Bold.woff2') format('woff2');font-weight:700}@font-face{font-family:'TikTok Sans';src:url('../fonts/tiktok-sans-cyrillic-standard-normal.woff2') format('woff2');font-weight:300 900}@font-face{font-family:'TikTok Sans';src:url('../fonts/tiktok-sans-latin-standard-normal.woff2') format('woff2');font-weight:300 900}:root{--font-heading:"Uncage",sans-serif;--font-body:"TikTok Sans",sans-serif}.title{font:700 48px var(--font-heading);fill:#151514}.sub{font:400 24px var(--font-body);fill:#74716B}.h{font:700 31px var(--font-heading);fill:#151514}.big{font:700 72px var(--font-heading);fill:#151514}.body{font:400 25px var(--font-body);fill:#4D4B47}.bold{font:700 25px var(--font-body);fill:#151514}.green{fill:#166534}.blue{fill:#3B82F6}.red{fill:#CF381B}.box{fill:#FFFFFF;stroke:#D9D6CF;stroke-width:2}</style>
  <text x="80" y="92" class="title">Количество — это не просто цифра</text><text x="80" y="135" class="sub">Рядом с числом должны быть единица измерения и пояснение</text>
  <text x="350" y="220" text-anchor="middle" class="h">ДО</text><text x="1220" y="220" text-anchor="middle" class="h">ПОСЛЕ</text>
  <rect x="150" y="270" width="400" height="390" rx="24" class="box"/><text x="200" y="335" class="body">Принято</text><text x="350" y="470" text-anchor="middle" class="big">8</text><text x="350" y="525" text-anchor="middle" class="red body">8 чего?</text><text x="350" y="570" text-anchor="middle" class="body">штук или коробов</text>
  <rect x="740" y="270" width="650" height="390" rx="24" class="box"/><text x="790" y="330" class="bold">План</text><text x="1110" y="330" class="bold">10 коробов × 12 штук = 120 штук</text><line x1="790" y1="360" x2="1340" y2="360" stroke="#D9D6CF" stroke-width="2"/><text x="790" y="420" class="bold">Факт</text><text x="1110" y="420" class="bold green">8 коробов = 96 штук</text><line x1="790" y1="450" x2="1340" y2="450" stroke="#D9D6CF" stroke-width="2"/><text x="790" y="510" class="bold">Осталось</text><text x="1110" y="510" class="bold blue">2 короба = 24 штуки</text><rect x="790" y="555" width="500" height="55" rx="12" fill="#DFF7ED"/><text x="1040" y="592" text-anchor="middle" class="bold green">Система сама показывает пересчёт</text>
  <text x="150" y="760" class="h">Правило</text><text x="150" y="805" class="body">Число без единицы измерения — это повод для ошибки.</text>
</svg>
