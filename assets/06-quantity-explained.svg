<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F6F8FB"/>
  <style>.title{font:700 48px Arial,sans-serif;fill:#0F172A}.sub{font:400 24px Arial,sans-serif;fill:#475569}.h{font:700 31px Arial,sans-serif;fill:#0F172A}.big{font:700 72px Arial,sans-serif;fill:#0F172A}.body{font:400 25px Arial,sans-serif;fill:#334155}.bold{font:700 25px Arial,sans-serif;fill:#0F172A}.green{fill:#166534}.blue{fill:#1D4ED8}.red{fill:#B91C1C}.box{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}</style>
  <text x="80" y="92" class="title">Количество — это не просто цифра</text><text x="80" y="135" class="sub">Рядом с числом всегда должны быть единица и смысл</text>
  <text x="350" y="220" text-anchor="middle" class="h">ДО</text><text x="1220" y="220" text-anchor="middle" class="h">ПОСЛЕ</text>
  <rect x="150" y="270" width="400" height="390" rx="24" class="box"/><text x="200" y="335" class="body">Принято</text><text x="350" y="470" text-anchor="middle" class="big">8</text><text x="350" y="525" text-anchor="middle" class="red body">8 чего?</text><text x="350" y="570" text-anchor="middle" class="body">штук или коробов</text>
  <rect x="740" y="270" width="650" height="390" rx="24" class="box"/><text x="790" y="330" class="bold">План</text><text x="1110" y="330" class="bold">10 коробов × 12 штук = 120 штук</text><line x1="790" y1="360" x2="1340" y2="360" stroke="#CBD5E1" stroke-width="2"/><text x="790" y="420" class="bold">Факт</text><text x="1110" y="420" class="bold green">8 коробов = 96 штук</text><line x1="790" y1="450" x2="1340" y2="450" stroke="#CBD5E1" stroke-width="2"/><text x="790" y="510" class="bold">Осталось</text><text x="1110" y="510" class="bold blue">2 короба = 24 штуки</text><rect x="790" y="555" width="500" height="55" rx="12" fill="#DCFCE7"/><text x="1040" y="592" text-anchor="middle" class="bold green">Система сама показывает пересчёт</text>
  <text x="150" y="760" class="h">Правило</text><text x="150" y="805" class="body">Число без единицы измерения — это повод для ошибки.</text>
</svg>
