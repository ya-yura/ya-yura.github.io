<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F6F8FB"/>
  <style>.title{font:700 48px Arial,sans-serif;fill:#0F172A}.sub{font:400 24px Arial,sans-serif;fill:#475569}.h{font:700 24px Arial,sans-serif;fill:#0F172A}.body{font:400 20px Arial,sans-serif;fill:#475569}.pill{font:700 18px Arial,sans-serif}.box{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.green{fill:#DCFCE7;stroke:#22C55E}.orange{fill:#FEF3C7;stroke:#F59E0B}.blue{fill:#DBEAFE;stroke:#60A5FA}</style>
  <text x="80" y="92" class="title">Общие блоки вместо отдельных решений</text><text x="80" y="135" class="sub">Один понятный блок можно использовать во всей системе</text>
  <rect x="80" y="235" width="270" height="430" rx="22" class="box"/><text x="215" y="290" text-anchor="middle" class="h">Результат</text><text x="215" y="325" text-anchor="middle" class="h">сканирования</text><rect x="110" y="370" width="210" height="58" rx="12" class="green"/><text x="215" y="407" text-anchor="middle" class="pill">Добавлено</text><rect x="110" y="450" width="210" height="58" rx="12" class="orange"/><text x="215" y="487" text-anchor="middle" class="pill">Нужно решить</text><rect x="110" y="530" width="210" height="58" rx="12" class="blue"/><text x="215" y="567" text-anchor="middle" class="pill">Нет связи</text>
  <rect x="380" y="235" width="270" height="430" rx="22" class="box"/><text x="515" y="290" text-anchor="middle" class="h">Понятное</text><text x="515" y="325" text-anchor="middle" class="h">количество</text><rect x="410" y="370" width="210" height="58" rx="12" class="green"/><text x="515" y="407" text-anchor="middle" class="pill">Принято</text><rect x="410" y="450" width="210" height="58" rx="12" class="orange"/><text x="515" y="487" text-anchor="middle" class="pill">Расхождение</text><rect x="410" y="530" width="210" height="58" rx="12" class="blue"/><text x="515" y="567" text-anchor="middle" class="pill">Ждём данные</text>
  <rect x="680" y="235" width="270" height="430" rx="22" class="box"/><text x="815" y="290" text-anchor="middle" class="h">Путь</text><text x="815" y="325" text-anchor="middle" class="h">документа</text><rect x="710" y="370" width="210" height="58" rx="12" class="green"/><text x="815" y="407" text-anchor="middle" class="pill">Сохранён</text><rect x="710" y="450" width="210" height="58" rx="12" class="orange"/><text x="815" y="487" text-anchor="middle" class="pill">Ждёт отправки</text><rect x="710" y="530" width="210" height="58" rx="12" class="blue"/><text x="815" y="567" text-anchor="middle" class="pill">Принят</text>
  <rect x="980" y="235" width="270" height="430" rx="22" class="box"/><text x="1115" y="290" text-anchor="middle" class="h">Подсказка</text><text x="1115" y="325" text-anchor="middle" class="h">при ошибке</text><rect x="1010" y="370" width="210" height="58" rx="12" class="green"/><text x="1115" y="407" text-anchor="middle" class="pill">Сохранено</text><rect x="1010" y="450" width="210" height="58" rx="12" class="orange"/><text x="1115" y="487" text-anchor="middle" class="pill">Проверьте связь</text><rect x="1010" y="530" width="210" height="58" rx="12" class="blue"/><text x="1115" y="567" text-anchor="middle" class="pill">Повторить</text>
  <rect x="1280" y="235" width="240" height="430" rx="22" class="box"/><text x="1400" y="290" text-anchor="middle" class="h">Очередь</text><text x="1400" y="325" text-anchor="middle" class="h">исключений</text><rect x="1305" y="370" width="190" height="58" rx="12" class="green"/><text x="1400" y="407" text-anchor="middle" class="pill">Новые</text><rect x="1305" y="450" width="190" height="58" rx="12" class="orange"/><text x="1400" y="487" text-anchor="middle" class="pill">В работе</text><rect x="1305" y="530" width="190" height="58" rx="12" class="blue"/><text x="1400" y="567" text-anchor="middle" class="pill">Решено</text>
  <text x="80" y="770" class="h">Так человеку легче ориентироваться на каждом шаге.</text>
</svg>
