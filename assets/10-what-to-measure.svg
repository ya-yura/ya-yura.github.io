<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#FFFDFC"/>
  <style>@font-face{font-family:'Uncage';src:url('../fonts/Uncage-Medium.woff2') format('woff2');font-weight:500}@font-face{font-family:'Uncage';src:url('../fonts/Uncage-Bold.woff2') format('woff2');font-weight:700}@font-face{font-family:'TikTok Sans';src:url('../fonts/tiktok-sans-cyrillic-standard-normal.woff2') format('woff2');font-weight:300 900}@font-face{font-family:'TikTok Sans';src:url('../fonts/tiktok-sans-latin-standard-normal.woff2') format('woff2');font-weight:300 900}:root{--font-heading:"Uncage",sans-serif;--font-body:"TikTok Sans",sans-serif}.title{font:700 48px var(--font-heading);fill:#151514}.sub{font:400 24px var(--font-body);fill:#74716B}.head{font:700 23px var(--font-heading);fill:#151514}.body{font:400 21px var(--font-body);fill:#4D4B47}.cell{fill:#FFFFFF;stroke:#D9D6CF;stroke-width:2}.blue{fill:#EEE9FF}.green{fill:#DFF7ED}</style>
  <text x="80" y="92" class="title">Что будем измерять</text><text x="80" y="135" class="sub">Сначала узнаём текущий уровень, потом сравниваем с результатом</text>
  <rect x="80" y="220" width="1440" height="75" rx="14" fill="#E8E5DE"/><text x="115" y="268" class="head">Что хотим улучшить</text><text x="615" y="268" class="head">Что смотрим</text><text x="1110" y="268" class="head">Как поймём, что стало лучше</text>
  <rect x="80" y="310" width="1440" height="86" class="cell"/><text x="115" y="362" class="body">Повторное сканирование</text><text x="615" y="362" class="body">Сколько раз действие повторяют</text><text x="1110" y="362" class="body">Повторов становится меньше</text>
  <rect x="80" y="396" width="1440" height="86" class="cell green"/><text x="115" y="448" class="body">Неполное завершение</text><text x="615" y="448" class="body">Сколько документов закрыли с пропусками</text><text x="1110" y="448" class="body">Опасных завершений меньше</text>
  <rect x="80" y="482" width="1440" height="86" class="cell"/><text x="115" y="534" class="body">Ошибки передачи</text><text x="615" y="534" class="body">Сколько документов не дошло</text><text x="1110" y="534" class="body">Ошибки быстрее находят и исправляют</text>
  <rect x="80" y="568" width="1440" height="86" class="cell green"/><text x="115" y="620" class="body">Время разбора</text><text x="615" y="620" class="body">Сколько длится работа с проблемой</text><text x="1110" y="620" class="body">Разбор занимает меньше времени</text>
  <rect x="80" y="654" width="1440" height="86" class="cell"/><text x="115" y="706" class="body">Ошибки количества</text><text x="615" y="706" class="body">Сколько раз пересчитывают товар</text><text x="1110" y="706" class="body">Пересчётов и споров меньше</text>
  <rect x="80" y="795" width="1440" height="55" rx="14" class="blue"/><text x="110" y="830" class="body">Не обещаем проценты заранее. Сначала измеряем, потом делаем вывод.</text>
</svg>
