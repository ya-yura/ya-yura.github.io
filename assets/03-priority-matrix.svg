<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F6F8FB"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker></defs>
  <style>.title{font:700 48px Arial,sans-serif;fill:#0F172A}.sub{font:400 24px Arial,sans-serif;fill:#475569}.axis{font:700 22px Arial,sans-serif;fill:#334155}.label{font:700 20px Arial,sans-serif;fill:#0F172A}.small{font:400 18px Arial,sans-serif;fill:#475569}.note{font:700 22px Arial,sans-serif;fill:#166534}</style>
  <text x="80" y="92" class="title">Что брать в первую очередь</text><text x="80" y="135" class="sub">Чем чаще проблема и чем сильнее её последствия, тем раньше её исправляем</text>
  <line x1="250" y1="740" x2="1370" y2="740" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/><line x1="250" y1="740" x2="250" y2="205" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="790" y="800" text-anchor="middle" class="axis">Как часто происходит</text><text x="135" y="480" text-anchor="middle" class="axis" transform="rotate(-90 135 480)">Насколько мешает работе</text>
  <line x1="810" y1="740" x2="810" y2="205" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="10 10"/><line x1="250" y1="470" x2="1370" y2="470" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="10 10"/>
  <rect x="850" y="235" width="470" height="195" rx="20" fill="#DCFCE7" stroke="#86EFAC" stroke-width="3"/><text x="1085" y="280" text-anchor="middle" class="note">ПЕРВЫЙ ВЫПУСК</text><text x="1085" y="315" text-anchor="middle" class="small">самые частые и опасные проблемы</text>
  <circle cx="1030" cy="370" r="36" fill="#DC2626"/><text x="1030" y="378" text-anchor="middle" fill="#FFFFFF" class="label">1</text><text x="1080" y="378" class="label">Повторное сканирование</text>
  <circle cx="1050" cy="415" r="27" fill="#F59E0B"/><text x="1100" y="423" class="label">Неполное завершение</text>
  <circle cx="1260" cy="535" r="23" fill="#F59E0B"/><text x="910" y="545" class="label">Неясное количество</text>
  <circle cx="1170" cy="620" r="19" fill="#2563EB"/><text x="1205" y="628" class="label">Ошибка связи</text>
  <circle cx="560" cy="560" r="22" fill="#64748B"/><text x="300" y="570" class="label">Неизвестный товар</text>
  <circle cx="510" cy="675" r="15" fill="#94A3B8"/><text x="300" y="685" class="label">Редкие настройки</text>
  <text x="260" y="780" class="small">Редко</text><text x="1300" y="780" class="small">Часто</text><text x="175" y="720" class="small">Мешает мало</text><text x="160" y="230" class="small">Мешает сильно</text>
</svg>
